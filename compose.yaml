services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lauril}
      POSTGRES_USER: ${POSTGRES_USER:-lauril}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - lauril_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lauril} -d ${POSTGRES_DB:-lauril}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lauril_postgres_data:
